[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
arrow-array = "60.2.0"
arrow-schema = "60.2.0"
memchr = "2.8.3"
memmap2 = "0.9.12"
mimalloc = "0.1.52"
parquet = { version = "60.2.0", default-features = false, features = ["arrow"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
